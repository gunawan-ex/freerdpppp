name: Windows - RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downloading & Installing Essentials
        run: cmd /c Downloads.bat

      - name: Enable RDP and open Port
        run: cmd /c enable_rdp_and_open_port.bat

      - name: Get RDP info
        run: cmd /c get_public_ip.bat

      - name: Setup Tunnel RDP via Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip -DestinationPath . -Force
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
          
          # Jalankan ngrok dengan pencatatan log ke berkas
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -WindowStyle Hidden
          
          # Tunggu dan coba hubungi API lokal hingga 10 kali
          $rdpUrl = $null
          for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 3
              try {
                  $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3 -ErrorAction Stop
                  if ($response.tunnels -and $response.tunnels.Count -gt 0) {
                      $rdpUrl = $response.tunnels[0].public_url -replace "tcp://", ""
                      break
                  }
              } catch {}
          }

          if ($rdpUrl) {
              Write-Output "=========================================="
              Write-Output "ALAMAT RDP KAMU : $rdpUrl"
              Write-Output "USER           : runneradmin"
              Write-Output "=========================================="
          } else {
              Write-Output "Gagal mendapatkan URL dari ngrok. Isi log ngrok:"
              if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
              if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
              exit 1
          }


      - name: Execute anydesk
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\anydesk_manage.ps1 -Password nk0ckhun9

      - name: Keep Alive Loop
        shell: pwsh
        run: |
          Write-Output "Runner aktif. Menjaga sesi tetap menyala..."
          while ($true) {
              Start-Sleep -Seconds 60
          }
