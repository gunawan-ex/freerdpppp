name: Windows - RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downloading & Installing Essentials
        run: cmd /c Downloads.bat

      - name: Enable RDP and open Port
        run: cmd /c enable_rdp_and_open_port.bat

      - name: Get RDP info
        run: cmd /c get_public_ip.bat

      - name: Setup Tunnel RDP via Pinggy
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Pinggy-io/pinggy-cli/releases/latest/download/pinggy_windows_amd64.zip" -OutFile "pinggy.zip"
          Expand-Archive pinggy.zip -DestinationPath . -Force

          # Jalankan tunnel TCP ke port 3389 tanpa token
          Start-Process -FilePath ".\pinggy.exe" -ArgumentList "tcp --port 3389 --log=stdout" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -WindowStyle Hidden

          # Tunggu dan ambil alamat URL tunnel
          $rdpUrl = $null
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "pinggy.log") {
                  $content = Get-Content "pinggy.log" -Raw
                  if ($content -match 'tcp://([a-zA-Z0-9\.\-]+:\d+)') {
                      $rdpUrl = $matches[1]
                      break
                  }
              }
          }

          if ($rdpUrl) {
              Write-Output "=========================================="
              Write-Output "ALAMAT RDP KAMU : $rdpUrl"
              Write-Output "USER           : runneradmin"
              Write-Output "=========================================="
          } else {
              Write-Output "Gagal mendapatkan URL dari Pinggy. Isi log:"
              if (Test-Path "pinggy.log") { Get-Content "pinggy.log" }
              if (Test-Path "pinggy_err.log") { Get-Content "pinggy_err.log" }
              exit 1
          }

      - name: Execute anydesk
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\anydesk_manage.ps1 -Password nk0ckhun9

      - name: Keep Alive Loop
        shell: pwsh
        run: |
          Write-Output "Runner aktif. Menjaga sesi tetap menyala..."
          while ($true) {
              Start-Sleep -Seconds 60
          }
