name: Windows - RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downloading & Installing Essentials
        run: cmd /c Downloads.bat

      - name: Enable RDP and open Port
        run: cmd /c enable_rdp_and_open_port.bat

      - name: Get RDP info
        run: cmd /c get_public_ip.bat

      - name: Execute anydesk
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\anydesk_manage.ps1 -Password Awanophile*123

      - name: Keep Alive Loop
        shell: pwsh
        run: |
          Write-Output "Runner aktif. Menjaga sesi tetap menyala..."
          while ($true) {
              Start-Sleep -Seconds 60
          }
