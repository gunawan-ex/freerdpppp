name: Windows - Chrome Remote Desktop

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache User Folders (Desktop & Documents)
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
          key: rdp-workspace-cache-${{ github.run_id }}
          restore-keys: |
            rdp-workspace-cache-

      - name: Downloading & Installing Essentials
        run: cmd /c Downloads.bat

      - name: Configure Desktop Environment
        shell: pwsh
        run: |
          # 1. Sembunyikan ikon desktop (Hide Desktop Icons)
          $explorerKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          Set-ItemProperty -Path $explorerKey -Name "HideIcons" -Value 1

          # 2. Aktifkan auto-hide taskbar (StuckRects3 byte ke-9 diubah dari 02 jadi 03)
          $stuckPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\StuckRects3"
          if (Test-Path $stuckPath) {
              $val = (Get-ItemProperty -Path $stuckPath).Settings
              $val[8] = 3
              Set-ItemProperty -Path $stuckPath -Name "Settings" -Value $val
          }

          # 3. Muat ulang Explorer agar perubahan langsung aktif
          Stop-Process -Name explorer -Force
          Start-Sleep -Seconds 2
          Start-Process explorer.exe

      - name: Setup Chrome Remote Desktop
        shell: pwsh
        env:
          CRD_AUTH_CODE: ${{ secrets.CRD_AUTH_CODE }}
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "crd.msi"
          Start-Process msiexec.exe -ArgumentList "/i crd.msi /qn" -Wait
          Start-Sleep -Seconds 5

          # Cari lokasi executable remoting_start_host.exe secara otomatis
          $hostExe = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop" -Filter "remoting_start_host.exe" -Recurse | Select-Object -First 1).FullName

          if (-not $hostExe) {
              $hostExe = (Get-ChildItem -Path "$env:ProgramFiles\Google\Chrome Remote Desktop" -Filter "remoting_start_host.exe" -Recurse | Select-Object -First 1).FullName
          }

          Write-Output "Lokasi CRD Host: $hostExe"
          & "$hostExe" --code="$env:CRD_AUTH_CODE" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$env:COMPUTERNAME --pin=123456

      - name: Keep Alive Loop
        shell: pwsh
        run: |
          Write-Output "Runner aktif. Terhubung via Chrome Remote Desktop..."
          while ($true) {
              Start-Sleep -Seconds 60
          }
